<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>The Thread Seers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // MIT License
        // https://github.com/rafgraph/spa-github-pages
        // This script takes the current url and converts the path and query
        // string into just a query string, and then redirects the browser
        // to the new url with only a query string and hash fragment,
        // e.g. https://www.foo.tld/one/two?a=b&c=d#qwe, becomes
        // https://www.foo.tld/?/one/two&a=b~and~c=d#qwe
        // Note: this 404.html file must be at least 512 bytes for it to work
        // with Internet Explorer (it is currently > 512 bytes)

        // Keep one path segment for the project-pages URL
        // (https://streamentry.github.io/thethreadseers.com/...), zero for a
        // custom domain (https://thethreadseers.com/...).

        var l = window.location;

        var pathSegmentsToKeep = l.pathname.split('/')[1] === 'thethreadseers.com' ? 1 : 0;

        var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash;

        // Use replace to avoid adding to browser history
        window.location.replace(redirectUrl);
    </script>
</head>
<body style="background:#0A0A0C;color:#F2EFE6;font-family:Georgia,serif;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:2rem;">
    <!-- Fallback content for users with JavaScript disabled -->
    <noscript>
        <p>This thread comes loose here — this site needs JavaScript to hold its pages together. Please enable it and refresh.</p>
    </noscript>
</body>
</html>
